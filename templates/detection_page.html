<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DeepFake Detection</title>
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css'>
  <link rel="stylesheet" href="{{url_for('static',filename='detection_page_style.css')}}">
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/sweetalert2/5.3.8/sweetalert2.css">
  <style>
    .file-input-box {
      margin-bottom: 40px;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-md bg navbar-dark fixed-top">
    <a class="navbar-brand" href="#"><img src="/static/Logo.png" width="110" height="30" class="im1"></a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/detection">Demo</a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="fade-transition">
    <div class="caption">
      <div id="app">
        <div class="container">
          <div class="file-input-box">
            <h4>Upload Image</h4>
            <button class="input-box" onclick="document.getElementById('image-input').click();">
              <i class="fa fa-upload"></i> Upload Image
            </button>
            <input id="image-input" type="file" accept="image/*" hidden/>
            <small>Files Supported: JPG, PNG</small>
          </div>
          <div class="file-input-box">
            <h4>Upload Video</h4>
            <button class="input-box" onclick="document.getElementById('video-input').click();">
              <i class="fa fa-upload"></i> Upload Video
            </button>
            <input id="video-input" type="file" accept="video/*" hidden/>
            <small>Files Supported: MP4, WEBM</small>
          </div>
        </div>
      </div>
      
      <div class="media-container">
        <video id="video-preview" width="400" height="250" controls style="display:none;"></video>
        <img id="image-preview" src="/static/face.png" class="im" style="display:none; max-width:400px;">
      </div>
      
      <div class="button-container">
        <button class="cool-button btn-1" onclick="detect()">Detect</button>
      </div>
    </div>

    <div class="image">
      <div class="card">
        <div class="box">
          <div class="percent" id="percent">
            <div class="number">
              <h2 id="score">0%</h2>
            </div>
          </div>
          <h2 class="text" id="text">Not Yet Detected</h2>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>DeepFake Detection App Developed by Amar Singh</p>
  </footer>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/sweetalert2/5.3.8/sweetalert2.js"></script>

  <script>
    // Handle Image Preview
    document.getElementById('image-input').addEventListener('change', function() {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        document.getElementById('image-preview').src = e.target.result;
        document.getElementById('image-preview').style.display = "block";
        document.getElementById('video-preview').style.display = "none";
      };
      reader.readAsDataURL(file);
    });

    // Handle Video Preview
    document.getElementById('video-input').addEventListener('change', function() {
      const file = this.files[0];
      if (!file) return;
      const video = document.getElementById('video-preview');
      const reader = new FileReader();
      reader.onload = function (e) {
        video.src = e.target.result;
        video.style.display = "block";
        document.getElementById('image-preview').style.display = "none";
        video.load();
        video.play();
      };
      reader.readAsDataURL(file);
    });

   function detect() {
  let imageInput = document.getElementById("image-input");
  let videoInput = document.getElementById("video-input");

  // Select correct file input (image or video)
  let fileInput = imageInput.files.length ? imageInput : videoInput;
  
  if (!fileInput.files.length) {
    swal("Error", "Please upload an image or video!", "error");
    return;
  }

  let file = fileInput.files[0];

  // Prevent file from being changed during upload
  fileInput.disabled = true;

  let apiEndpoint = file.type.startsWith('image/') ? "/DetectImage" : "/Detect";

  let formData = new FormData();
  formData.append("file", file);

  swal({
    text: "AI is Analyzing your file",
    title: 'Please Wait...',
    allowEscapeKey: false,
    allowOutsideClick: false,
    onOpen: () => {
      swal.showLoading();
    }
  });

  fetch(apiEndpoint, {
    method: "POST",
    body: formData
  })
  .then(response => {
    if (!response.ok) {
      throw new Error(`HTTP error! Status: ${response.status}`);
    }
    return response.json();
  })
  .then(data => {
    swal.close();
    fileInput.disabled = false;  // Re-enable input field

    if (data.error) {
      document.getElementById("text").innerHTML = data["Pred"] || "Error";
      document.getElementById("score").innerHTML = data["Score"] || "N/A";
      document.getElementById("percent").style.background = "#FF474C";
      return;
    }

    document.getElementById("text").innerHTML = data["Pred"];
    document.getElementById("score").innerHTML = data["Score"] + "%";
    document.getElementById("percent").style.background = data["Pred"] === "FAKE" ? "#FF474C" : "#96F97B";
  })
  .catch(error => {
    console.error("Error:", error);
    swal.close();
    fileInput.disabled = false;
    swal("Error", "Failed to upload file or server is not responding!", "error");
    document.getElementById("text").innerHTML = "API Error";
    document.getElementById("score").innerHTML = "N/A";
    document.getElementById("percent").style.background = "#FF474C";
  });
}

  </script>
</body>
</html>
